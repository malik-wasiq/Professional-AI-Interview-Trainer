{% extends "base.html" %}

{% block title %}Interview Setup • Professional AI Interview Trainer{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-icon">🎤</div>
    <div>
        <div class="page-header-title">Interview Setup</div>
        <div class="page-header-subtitle">Tell us about the interview you want to practice.</div>
    </div>
</div>

{% if errors %}
<div class="card">
    {% for message in errors %}
    <p class="form-error">{{ message }}</p>
    {% endfor %}
</div>
{% endif %}

<form class="card" method="POST" action="{{ url_for('setup') }}">
    <label for="job_role">Job Role</label>
    <select id="job_role" name="job_role" required>
        {% for role in job_roles %}
        <option value="{{ role }}" {% if form and form.get('job_role') == role %}selected{% endif %}>{{ role }}</option>
        {% endfor %}
    </select>

    <label for="interview_type">Interview Type</label>
    <select id="interview_type" name="interview_type" required>
        {% for t in interview_types %}
        <option value="{{ t }}" {% if form and form.get('interview_type') == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
    </select>

    <label for="experience_level">Experience Level</label>
    <select id="experience_level" name="experience_level" required>
        {% for level in experience_levels %}
        <option value="{{ level }}" {% if form and form.get('experience_level') == level %}selected{% endif %}>{{ level }}</option>
        {% endfor %}
    </select>

    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty" required>
        {% for d in difficulties %}
        <option value="{{ d }}" {% if form and form.get('difficulty') == d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
    </select>

    <label for="language">Language</label>
    <select id="language" name="language" required>
        {% for lang in languages %}
        <option value="{{ lang }}" {% if form and form.get('language') == lang %}selected{% endif %}>{{ lang }}</option>
        {% endfor %}
    </select>

    <label for="interviewer_style">Interviewer Style</label>
    <select id="interviewer_style" name="interviewer_style" required>
        {% for style in styles %}
        <option value="{{ style }}" {% if form and form.get('interviewer_style') == style %}selected{% endif %}>{{ style }}</option>
        {% endfor %}
    </select>

    <label for="job_description">Job Description <span class="optional-tag">(optional)</span></label>
    <textarea id="job_description" name="job_description" rows="3"
              placeholder="Paste the job description if you have one...">{{ form.get('job_description', '') if form else '' }}</textarea>

    <label for="custom_instructions">Custom Instructions <span class="optional-tag">(optional)</span></label>
    <textarea id="custom_instructions" name="custom_instructions" rows="3"
              placeholder="Anything specific you'd like the interviewer to focus on...">{{ form.get('custom_instructions', '') if form else '' }}</textarea>

    <button type="submit" class="btn btn-primary">Generate Question</button>
</form>
{% endblock %}
